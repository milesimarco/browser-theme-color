name: Update WordPress.org assets and readme

on:
  push:
    branches: [main]
    paths:
      - readme.txt
      - .wordpress-org/**
  workflow_dispatch:

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Skip while a new version is pending release: the deploy workflow handles it.
      - name: Check stable tag exists on WordPress.org
        id: check
        run: |
          STABLE=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $3}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://plugins.svn.wordpress.org/browser-theme-color/tags/$STABLE/")
          echo "stable=$STABLE http=$CODE"
          if [ "$CODE" = "200" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: 10up/action-wordpress-plugin-asset-update@stable
        if: steps.check.outputs.run == 'true'
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: browser-theme-color
          IGNORE_OTHER_FILES: true
